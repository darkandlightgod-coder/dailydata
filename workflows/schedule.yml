name: Daily Morning Report

on:
  schedule:
    # 每天定時執行：UTC 22:30 等於台灣時間早上 06:30
    - cron: '30 22 * * *'
  workflow_dispatch: 

permissions:
  contents: write # 賦予 GitHub Actions 寫入權限，用來自動提交保活更新

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Run script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python morning_report.py

      # 自動防止 GitHub 因 60 天無活動而暫停排程
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2

