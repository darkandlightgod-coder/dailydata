name: Daily Morning Report

on:
  schedule:
    # 每天定時執行：UTC 22:30 等於台灣時間早上 06:30
    - cron: '30 22 * * *'
  # 加上這行，就能在 GitHub 網頁上手動點擊測試
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.
